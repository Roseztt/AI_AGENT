version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports: ["11434:11434"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    container_name: ai_agent_api
    depends_on: [ollama]
    ports: ["8000:8000"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CHROMA_DIR=/app/chroma
    volumes:
      - chroma_data:/app/chroma
    restart: unless-stopped

  frontend:
    build: ./AI_AGENT_Frontend
    container_name: ai_agent_frontend
    depends_on: [api]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000 
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_models:
